openapi: 3.0.3
info:
  title: Maxi Eventos - Gateway (descarga de documentos)
  description: >-
    Rutas REST de SOLO LECTURA del gateway (Fase 10) para descargar los PDF del contrato y del anexo desde la interfaz web.
    GraphQL no sirve bien contenido binario, así que el gateway expone estas dos rutas, que reenvían la petición a
    contratos-service (GET /api/v1/eventos/{eventoId}/contrato/pdf y GET /api/v1/eventos/{eventoId}/adicionales/anexo-pdf)
    con el MISMO token, sin lógica de negocio. El token se valida en el gateway antes de llamar a nadie (firma, vigencia y
    emisor) y contratos-service lo vuelve a validar. Va siempre en el header Authorization, nunca en la URL. Los errores de
    contratos-service se devuelven con el formato ErrorResponse y el mensaje en español del servicio. CORS: solo los
    orígenes de CORS_ALLOWED_ORIGINS (GET y OPTIONS; cabeceras Authorization, Accept y X-Request-Id; expone
    Content-Disposition y X-Request-Id). Desde la 1.1.0 (Fase 11C) cada petición puede llevar un código de referencia
    X-Request-Id: el gateway lo escribe en su log junto al error real, lo reenvía a contratos-service y lo devuelve en la
    respuesta; la interfaz muestra "Ref: <8 primeros caracteres>" junto a un mensaje genérico en los errores técnicos
    (502/503). El resto del gateway es GraphQL (POST /graphql), documentado en docs/graphql.md.
  version: 1.1.0
servers:
  - url: http://localhost:8090
security:
  - bearerAuth: []
paths:
  /documentos/eventos/{eventoId}/contrato.pdf:
    get:
      operationId: descargarContratoPdf
      summary: Descargar el PDF del contrato del evento
      description: >-
        Reenvía a contratos-service GET /api/v1/eventos/{eventoId}/contrato/pdf. Enviar Accept "application/pdf,
        application/json": el PDF en el caso normal y el ErrorResponse en JSON si hay un error.
      parameters:
        - $ref: '#/components/parameters/eventoId'
        - $ref: '#/components/parameters/accept'
        - $ref: '#/components/parameters/referencia'
      responses:
        '200':
          $ref: '#/components/responses/Pdf'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El evento no tiene contrato (mensaje de contratos-service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-03T16:19:12.402Z'
                status: 404
                error: Not Found
                message: No existe un contrato para el evento 11111111-1111-1111-1111-111111111111
                path: /documentos/eventos/11111111-1111-1111-1111-111111111111/contrato.pdf
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /documentos/eventos/{eventoId}/anexo.pdf:
    get:
      operationId: descargarAnexoPdf
      summary: Descargar el PDF del anexo de servicios adicionales
      description: >-
        Reenvía a contratos-service GET /api/v1/eventos/{eventoId}/adicionales/anexo-pdf. El anexo lista los servicios
        adicionales y sus valores sin modificar el contrato original. Sin contrato → 404; sin servicios adicionales → 409.
      parameters:
        - $ref: '#/components/parameters/eventoId'
        - $ref: '#/components/parameters/accept'
        - $ref: '#/components/parameters/referencia'
      responses:
        '200':
          $ref: '#/components/responses/Pdf'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El evento no tiene contrato (mensaje de contratos-service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-03T16:19:12.402Z'
                status: 404
                error: Not Found
                message: No existe un contrato para el evento 11111111-1111-1111-1111-111111111111
                path: /documentos/eventos/11111111-1111-1111-1111-111111111111/anexo.pdf
        '409':
          description: El evento no tiene servicios adicionales (mensaje de contratos-service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-03T16:19:11.873Z'
                status: 409
                error: Conflict
                message: El evento no tiene servicios adicionales; no hay anexo que generar.
                path: /documentos/eventos/b90eafba-08c6-4cfc-9ed4-b6cf07300655/anexo.pdf
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de la mutation login del gateway (o de POST /api/v1/auth/login). Header Authorization Bearer.
  parameters:
    eventoId:
      name: eventoId
      in: path
      required: true
      description: Id del evento (UUID)
      schema:
        type: string
        format: uuid
      example: af79495b-9065-4b83-b08e-83ca7edabc5a
    accept:
      name: Accept
      in: header
      required: false
      description: >-
        Recomendado "application/pdf, application/json". Si solo se acepta application/pdf, un error no se puede
        devolver como JSON.
      schema:
        type: string
      example: application/pdf, application/json
    referencia:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Código de referencia de la petición (Fase 11C), un UUID que genera la interfaz. Solo se acepta [A-Za-z0-9-] de 8 a
        64 caracteres; si falta o no cumple, el gateway genera uno nuevo. Se escribe en el log, se reenvía a
        contratos-service y vuelve en la respuesta.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
      example: 3f9a12bc-1111-4222-8333-444455556666
  headers:
    XRequestId:
      description: El código de referencia de la petición (el recibido o uno generado por el gateway); expuesto por CORS.
      schema:
        type: string
      example: 3f9a12bc-1111-4222-8333-444455556666
    ContentDisposition:
      description: Adjunto con el nombre del archivo (contrato-<eventoId>.pdf o anexo-<eventoId>.pdf); expuesto por CORS.
      schema:
        type: string
      example: attachment; filename="contrato-af79495b-9065-4b83-b08e-83ca7edabc5a.pdf"
    CacheControl:
      description: El documento no se guarda en caché.
      schema:
        type: string
      example: no-store
  schemas:
    ErrorResponse:
      type: object
      description: Mismo formato de error que los servicios.
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
          description: Mensaje en español (el de contratos-service cuando el error viene de allí)
        path:
          type: string
  responses:
    Pdf:
      description: El PDF generado por contratos-service, tal cual
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    IdInvalido:
      description: El id del evento no es un UUID (no se llama a contratos-service)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T16:19:12.402Z'
            status: 400
            error: Bad Request
            message: El identificador del evento no es un UUID válido.
            path: /documentos/eventos/abc/contrato.pdf
    Unauthorized:
      description: Falta el token, venció o no es válido (lo rechaza el gateway sin llamar a contratos-service)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sinToken:
              summary: Sin el header Authorization
              value:
                timestamp: '2026-11-03T16:19:12.380Z'
                status: 401
                error: Unauthorized
                message: 'Debes iniciar sesión para realizar esta operación. Envía el header Authorization: Bearer <token>.'
                path: /documentos/eventos/b90eafba-08c6-4cfc-9ed4-b6cf07300655/contrato.pdf
            vencido:
              summary: Token vencido
              value:
                timestamp: '2026-11-03T16:19:12.380Z'
                status: 401
                error: Unauthorized
                message: El token venció. Inicia sesión de nuevo con la mutation login.
                path: /documentos/eventos/b90eafba-08c6-4cfc-9ed4-b6cf07300655/contrato.pdf
            invalido:
              summary: Token manipulado, de otro emisor o mal firmado
              value:
                timestamp: '2026-11-03T16:19:12.380Z'
                status: 401
                error: Unauthorized
                message: El token no es válido. Inicia sesión de nuevo con la mutation login.
                path: /documentos/eventos/b90eafba-08c6-4cfc-9ed4-b6cf07300655/contrato.pdf
    BadGateway:
      description: contratos-service respondió con un error inesperado (5xx distinto de 502, 503 y 504)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T16:19:12.402Z'
            status: 502
            error: Bad Gateway
            message: El servicio de contratos tuvo un error al atender la solicitud.
            path: /documentos/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/contrato.pdf
    ServiceUnavailable:
      description: contratos-service no responde (caído, sin conexión o timeout) o respondió 502, 503 o 504
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T16:19:12.402Z'
            status: 503
            error: Service Unavailable
            message: El servicio de contratos no está disponible en este momento. Intenta de nuevo más tarde.
            path: /documentos/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/contrato.pdf
