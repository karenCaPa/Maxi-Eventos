openapi: 3.0.3
info:
  title: Maxi Eventos - Logística Service
  description: >-
    Calcula los requerimientos (meseros, personal de cocina y camiones) y la lista de compras de cada evento confirmado.
    No se crean por REST: se generan al consumir EVENTO_CONFIRMADO (eventos.confirmados) y se recalculan al consumir
    SERVICIO_ADICIONAL_AGREGADO (servicios-adicionales.agregados), con idempotencia en logistica_eventos_procesados.
    Mientras el evento no esté confirmado, sus consultas responden 404. Desde la 10B3 la lista de compras es una lista de
    chequeo editable: además de marcar ítems, se pueden agregar ítems MANUALES, editar cualquiera y quitar solo los
    manuales; cada ítem indica su origen (CALCULADO o MANUAL). El recálculo por un servicio adicional NO toca la lista de
    compras (conserva los ítems manuales y las marcas).
  version: 1.1.0
servers:
  - url: http://localhost:8088/api/v1
security:
  - bearerAuth: []
paths:
  /eventos/{eventoId}/logistica:
    get:
      operationId: obtenerRequerimientosLogistica
      summary: Obtener los requerimientos de personal y transporte del evento
      description: >-
        Respuesta cacheada en Redis (logistica-requerimientos, 30 min); se invalida al recalcular por un servicio
        adicional. Si Redis no responde, se consulta la base de datos.
      parameters:
        - $ref: '#/components/parameters/eventoId'
      responses:
        '200':
          description: Requerimientos calculados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequerimientosLogistica'
              example:
                eventoId: af79495b-9065-4b83-b08e-83ca7edabc5a
                meserosRequeridos: 7
                personalCocinaRequerido: 4
                camionesTransporte: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /eventos/{eventoId}/compras:
    parameters:
      - $ref: '#/components/parameters/eventoId'
    get:
      operationId: obtenerListaCompras
      summary: Obtener la página de compras e insumos del evento
      description: 'Campos para sort: id, nombreItem, comprado (por defecto nombreItem,asc). No se cachea.'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Página de ítems de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaItemCompra'
              example:
                contenido:
                  - id: 9d08297c-32b0-4eb6-a0f2-20bba607ad1b
                    nombreItem: Bebidas
                    cantidadEstimada: 210 unidades
                    comprado: false
                    origen: CALCULADO
                    nota: null
                  - id: ea55c05a-7ccf-4616-bd80-bf5dcce215aa
                    nombreItem: Hielo
                    cantidadEstimada: 11 bolsas
                    comprado: true
                    origen: CALCULADO
                    nota: null
                  - id: 3f1e2d4c-5b6a-4c7d-8e9f-0a1b2c3d4e5f
                    nombreItem: Recuerdos para invitados
                    cantidadEstimada: 100 unidades
                    comprado: false
                    origen: MANUAL
                    nota: Bolsas de tela con dulces
                pagina: 0
                tamanoPagina: 3
                totalElementos: 5
                totalPaginas: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: actualizarCompras
      summary: Marcar ítems de compra como comprados (o no)
      description: >-
        Marca los ítems y devuelve la página de compras ya actualizada (page, size y sort igual que el GET). Si un ítem no
        existe o es de otro evento responde 404 y no se aplica ningún cambio. Lista vacía → 400.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ActualizarItemCompraRequest'
            example:
              - id: 9d08297c-32b0-4eb6-a0f2-20bba607ad1b
                comprado: true
      responses:
        '200':
          description: Página de compras con los estados actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaItemCompra'
              example:
                contenido:
                  - id: 9d08297c-32b0-4eb6-a0f2-20bba607ad1b
                    nombreItem: Bebidas
                    cantidadEstimada: 210 unidades
                    comprado: true
                    origen: CALCULADO
                    nota: null
                  - id: ea55c05a-7ccf-4616-bd80-bf5dcce215aa
                    nombreItem: Hielo
                    cantidadEstimada: 11 bolsas
                    comprado: false
                    origen: CALCULADO
                    nota: null
                pagina: 0
                tamanoPagina: 2
                totalElementos: 4
                totalPaginas: 2
        '400':
          description: Lista vacía, ítem sin id o sin comprado, o parámetros de página inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-10-31T00:11:55Z'
                status: 400
                error: Bad Request
                message: Los datos enviados no son válidos. Revisa los campos indicados.
                path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras
                errores:
                  - campo: solicitudes
                    mensaje: no debe estar vacío
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El evento no tiene logística o un ítem no pertenece al evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-10-31T00:11:55Z'
                status: 404
                error: Not Found
                message: No existe el ítem de compra 11111111-1111-1111-1111-111111111111 en el evento af79495b-9065-4b83-b08e-83ca7edabc5a
                path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: agregarItemCompra
      summary: Agregar un ítem MANUAL a la lista de compras (10B3)
      description: >-
        El ítem queda sin marcar, con origen MANUAL. Nombre repetido en el evento (sin distinguir mayúsculas ni espacios al
        inicio o final) → 409. Invalida la caché de logística del evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCompraRequest'
            example:
              nombreItem: Recuerdos para invitados
              cantidadEstimada: 100 unidades
              nota: Bolsas de tela con dulces
      responses:
        '201':
          description: Ítem agregado
          headers:
            Location:
              description: URL del ítem (/api/v1/eventos/{eventoId}/compras/{itemId}).
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCompraResponseDTO'
              example:
                id: 3f1e2d4c-5b6a-4c7d-8e9f-0a1b2c3d4e5f
                nombreItem: Recuerdos para invitados
                cantidadEstimada: 100 unidades
                comprado: false
                origen: MANUAL
                nota: Bolsas de tela con dulces
        '400':
          $ref: '#/components/responses/ItemInvalido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NombreRepetido'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /eventos/{eventoId}/compras/{itemId}:
    parameters:
      - $ref: '#/components/parameters/eventoId'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 3f1e2d4c-5b6a-4c7d-8e9f-0a1b2c3d4e5f
    put:
      operationId: editarItemCompra
      summary: Editar un ítem de la lista de compras, calculado o manual (10B3)
      description: >-
        Cambia nombre, cantidad y nota; conserva el origen y la marca de comprado. Nombre de otro ítem del evento → 409.
        Ítem de otro evento o evento sin logística → 404. Invalida la caché de logística del evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCompraRequest'
            example:
              nombreItem: Hielo en cubos
              cantidadEstimada: 15 bolsas
              nota: Pedir al proveedor de siempre
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCompraResponseDTO'
              example:
                id: ea55c05a-7ccf-4616-bd80-bf5dcce215aa
                nombreItem: Hielo en cubos
                cantidadEstimada: 15 bolsas
                comprado: true
                origen: CALCULADO
                nota: Pedir al proveedor de siempre
        '400':
          $ref: '#/components/responses/ItemInvalido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNoEncontrado'
        '409':
          $ref: '#/components/responses/NombreRepetido'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: quitarItemCompra
      summary: Quitar un ítem MANUAL de la lista de compras (10B3)
      description: >-
        Solo los ítems MANUAL. Un ítem CALCULADO por el sistema → 409 (se puede editar o dejar sin marcar). Invalida la
        caché de logística del evento.
      responses:
        '204':
          description: Ítem quitado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNoEncontrado'
        '409':
          description: El ítem fue calculado por el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-03T22:10:00Z'
                status: 409
                error: Conflict
                message: Los ítems calculados por el sistema no se pueden quitar; puedes editarlos o dejarlos sin marcar.
                path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras/ea55c05a-7ccf-4616-bd80-bf5dcce215aa
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: >-
        Solicitud inválida: eventoId que no es UUID, page/size fuera de rango, sort no permitido o ruta sin identificador
        (por ejemplo /eventos//compras)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            identificadorInvalido:
              value:
                timestamp: '2026-10-31T00:11:55Z'
                status: 400
                error: Bad Request
                message: Los datos enviados no son válidos. Revisa los campos indicados.
                path: /api/v1/eventos/abc/logistica
                errores:
                  - campo: eventoId
                    mensaje: debe ser un identificador válido (UUID)
            rutaInvalida:
              value:
                timestamp: '2026-10-31T00:11:55Z'
                status: 400
                error: Bad Request
                message: 'La ruta no es válida: falta un identificador o contiene caracteres no permitidos.'
                path: /api/v1/eventos//compras
            tamanoFueraDeRango:
              value:
                timestamp: '2026-10-31T00:11:55Z'
                status: 400
                error: Bad Request
                message: Los datos enviados no son válidos. Revisa los campos indicados.
                path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras
                errores:
                  - campo: size
                    mensaje: debe ser menor que o igual a 100
    Unauthorized:
      description: Falta el token, venció o no es válido (firma, emisor o formato). Cuerpo ErrorResponse (Fase 7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sinToken:
              value: {timestamp: '2026-10-31T00:11:53Z', status: 401, error: Unauthorized, message: 'Debes iniciar sesión para realizar esta operación. Envía el header Authorization: Bearer <token>.', path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/logistica}
            tokenVencido:
              value: {timestamp: '2026-10-31T00:11:53Z', status: 401, error: Unauthorized, message: El token venció. Inicia sesión de nuevo., path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/logistica}
            tokenInvalido:
              value: {timestamp: '2026-10-31T00:11:53Z', status: 401, error: Unauthorized, message: El token no es válido. Inicia sesión de nuevo., path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/logistica}
    NotFound:
      description: El evento no tiene logística (no está confirmado o no existe)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-10-31T00:11:55Z'
            status: 404
            error: Not Found
            message: No existe logística para el evento 633930f6-534f-4687-96c7-e853be0c3389
            path: /api/v1/eventos/633930f6-534f-4687-96c7-e853be0c3389/logistica
    ItemInvalido:
      description: Datos del ítem inválidos (detalle por campo) o identificador que no es UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T22:10:00Z'
            status: 400
            error: Bad Request
            message: Los datos enviados no son válidos. Revisa los campos indicados.
            path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras
            errores:
              - campo: cantidadEstimada
                mensaje: no debe estar vacío
              - campo: nombreItem
                mensaje: no debe estar vacío
    ItemNoEncontrado:
      description: El evento no tiene logística o el ítem no pertenece al evento
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T22:10:00Z'
            status: 404
            error: Not Found
            message: No existe el ítem de compra 11111111-1111-1111-1111-111111111111 en el evento af79495b-9065-4b83-b08e-83ca7edabc5a
            path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras/11111111-1111-1111-1111-111111111111
    NombreRepetido:
      description: Ya hay un ítem con ese nombre en la lista de compras del evento
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-11-03T22:10:00Z'
            status: 409
            error: Conflict
            message: Ya hay un ítem «hielo» en la lista de compras de este evento.
            path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/compras
    InternalServerError:
      description: Error interno del servidor (mensaje neutro; el detalle queda solo en el log del servicio)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: {timestamp: '2026-10-31T00:11:55Z', status: 500, error: Internal Server Error, message: Ocurrió un error interno. Intenta de nuevo más tarde., path: /api/v1/eventos/af79495b-9065-4b83-b08e-83ca7edabc5a/logistica}
  parameters:
    eventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: af79495b-9065-4b83-b08e-83ca7edabc5a
    page:
      name: page
      in: query
      required: false
      description: Número de página (empieza en 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      required: false
      description: Tamaño de página (máximo 100); fuera de rango responde 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    sort:
      name: sort
      in: query
      required: false
      description: 'Ordenamiento campo,asc o campo,desc con los campos id, nombreItem o comprado; otro valor responde 400.'
      schema:
        type: string
        example: nombreItem,asc
  schemas:
    ErrorResponse:
      type: object
      description: Formato único de error en todos los microservicios. errores solo aparece cuando hay detalles por campo.
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-10-31T00:11:55Z'
        status:
          type: integer
          example: 404
        error:
          type: string
          description: Frase estándar del código HTTP.
          example: Not Found
        message:
          type: string
          description: Mensaje en español, entendible para la organizadora.
          example: No existe logística para el evento 633930f6-534f-4687-96c7-e853be0c3389
        path:
          type: string
          example: /api/v1/eventos/633930f6-534f-4687-96c7-e853be0c3389/logistica
        errores:
          type: array
          description: Detalle por campo (solo en errores de validación o de formato).
          items:
            $ref: '#/components/schemas/ErrorCampo'
    ErrorCampo:
      type: object
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          example: solicitudes
        mensaje:
          type: string
          example: no debe estar vacío
    RequerimientosLogistica:
      type: object
      properties:
        eventoId:
          type: string
          format: uuid
          example: af79495b-9065-4b83-b08e-83ca7edabc5a
        meserosRequeridos:
          type: integer
          example: 7
        personalCocinaRequerido:
          type: integer
          example: 4
        camionesTransporte:
          type: integer
          description: Incluye los camiones de los servicios adicionales de transporte (regla provisional, ver docs/kafka.md).
          example: 3
    ItemCompraResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9d08297c-32b0-4eb6-a0f2-20bba607ad1b
        nombreItem:
          type: string
          example: Bebidas
        cantidadEstimada:
          type: string
          description: Cantidad o descripción. En los CALCULADOS sale del número de invitados; en los MANUALES la escribe la organizadora.
          example: 210 unidades
        comprado:
          type: boolean
          description: Conseguido (comprado) o pendiente.
          example: false
        origen:
          type: string
          enum: [CALCULADO, MANUAL]
          description: CALCULADO lo generó el sistema al confirmar el evento; MANUAL lo agregó la organizadora (solo estos se quitan).
          example: CALCULADO
        nota:
          type: string
          nullable: true
          example: null
    ItemCompraRequest:
      type: object
      required: [nombreItem, cantidadEstimada]
      properties:
        nombreItem:
          type: string
          minLength: 1
          maxLength: 120
          example: Recuerdos para invitados
        cantidadEstimada:
          type: string
          minLength: 1
          maxLength: 80
          description: Cantidad o descripción ("100 unidades", "una por mesa").
          example: 100 unidades
        nota:
          type: string
          maxLength: 255
          nullable: true
          example: Bolsas de tela con dulces
    ActualizarItemCompraRequest:
      type: object
      required: [id, comprado]
      properties:
        id:
          type: string
          format: uuid
          example: 9d08297c-32b0-4eb6-a0f2-20bba607ad1b
        comprado:
          type: boolean
          example: true
    PaginaItemCompra:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/ItemCompraResponseDTO'
    PaginaBase:
      type: object
      description: Página de resultados (formato propio de la API, igual en todos los listados).
      required: [contenido, pagina, tamanoPagina, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items: {}
        pagina:
          type: integer
          description: Número de la página devuelta (empieza en 0).
          example: 0
        tamanoPagina:
          type: integer
          description: Tamaño de página solicitado.
          example: 20
        totalElementos:
          type: integer
          format: int64
          description: Total de elementos que cumplen el filtro.
          example: 4
        totalPaginas:
          type: integer
          description: Total de páginas.
          example: 1
