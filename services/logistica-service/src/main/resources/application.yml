spring:
  # Mensajes de validación siempre en español, sin depender de la cabecera Accept-Language
  web:
    locale: es
    locale-resolver: fixed
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: logistica-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/maxi_eventos}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Si la BD no responde, falla en 5 s (no 30): el consumidor Kafka reintenta y, agotados los intentos, va al DLT.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: logistica-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.value.default.type]": com.maxieventos.logistica.kafka.MensajeKafka
        "[spring.json.trusted.packages]": com.maxieventos.logistica.kafka
        "[spring.json.use.type.headers]": false
        # Fase 11E: refresca los metadatos (particiones nuevas de un tópico) cada 30 s en lugar de cada 5 minutos
        "[metadata.max.age.ms]": 30000
    listener:
      ack-mode: record
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      # Si Redis no responde, se espera como máximo 2 s antes de consultar la base de datos
      timeout: 2s
      connect-timeout: 2s
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8088}

maxi-eventos:
  cache:
    ttl:
      logistica-requerimientos: ${CACHE_TTL_LOGISTICA_REQUERIMIENTOS:PT30M}
  logistica:
    # Efecto de cada servicio adicional (código del catálogo de Finanzas) en la logística del evento, por unidad.
    # Un código que no aparece no tiene efecto.
    # TODO regla real: PROVISIONAL, confirmar con la organizadora.
    efectos-adicionales:
      transporte-adicional:
        camiones-por-unidad: 1
        meseros-por-unidad: 0
        cocina-por-unidad: 0
      hora-extra:
        camiones-por-unidad: 0
        meseros-por-unidad: 0
        cocina-por-unidad: 0
      decoracion-premium:
        camiones-por-unidad: 0
        meseros-por-unidad: 0
        cocina-por-unidad: 0

logging:
  # Fase 11C: código de referencia de la petición (X-Request-Id; "-" en los consumidores Kafka)
  pattern:
    correlation: "[ref=%X{ref:--}] "
  level:
    "[com.maxieventos.logistica]": INFO
    # HIT / MISS / PUT / EVICT de la caché Redis (subir a WARN para ocultarlos)
    "[maxieventos.cache]": INFO

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    # Emisor que debe traer el token (lo pone auth-service); no es un secreto
    issuer: maxi-eventos-auth

management:
  # Redis es solo una caché con respaldo (CacheErrorHandlerConRegistro consulta la base de datos si falla):
  # su caída no debe dejar el servicio DOWN, así que no forma parte del health.
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized